<script>
// Draw a whorl: nested, slightly wobbling loops, each left open at the bottom
// like a real ridge, and write the never-list along every ridge.
const words = ["apologise on my behalf", "say I love you", "end a relationship", "vote", "write the first draft",
  "comfort someone who's grieving", "make promises for me", "reply to my mum", "give a eulogy", "say thank you",
  "change my mind for me", "choose my kid's name", "sign my name", "hold someone's hand", "be wrong on purpose", "say sorry"];
const svg = document.getElementById("print"), NS = "http://www.w3.org/2000/svg";
let k = 0;
for (let i = 0; i < 16; i++) {
  const r = 34 + i * 18.5, cx = Math.sin(i * .7) * 3, cy = i * 1.2 - 10;
  const start = Math.PI * (0.62 + Math.sin(i * 1.3) * .05), end = start + Math.PI * (1.76 - (i % 3) * .05);
  let d = "";
  for (let s = 0; s <= 160; s++) {
    const t = start + (end - start) * s / 160;
    const w = 1 + .018 * Math.sin(t * 5 + i * .4) + .008 * Math.sin(t * 9 - i);
    const x = cx + Math.cos(t) * r * .82 * w, y = cy + Math.sin(t) * r * w;
    d += (s ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  const p = document.createElementNS(NS, "path"); p.setAttribute("id", "r" + i); p.setAttribute("d", d); p.setAttribute("fill", "none");
  svg.appendChild(p);
  const len = p.getTotalLength(); let line = "";
  while (line.length * 6.3 < len) { line += words[k++ % words.length] + " · "; }
  const t = document.createElementNS(NS, "text"), tp = document.createElementNS(NS, "textPath");
  tp.setAttribute("href", "#r" + i); tp.textContent = line;
  if (i === 7) { t.setAttribute("class", "v"); tp.textContent = ("say I love you · ").repeat(40); }
  t.appendChild(tp); svg.appendChild(t);
}
</script>
