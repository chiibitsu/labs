<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tuesday 2050</title>
<meta name="description" content="A ten-minute game. Live one ordinary day in 2050, when AI is native to the world. Feel what changed, what stayed, and what is still yours to choose." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Tuesday, 2050" />
<meta property="og:description" content="One ordinary day, ten minutes. AI is native to the world. What do you still choose?" />
<meta property="og:url" content="https://labs.chiibitsu.com/tuesday-2050/" />
<meta property="og:image" content="https://labs.chiibitsu.com/tuesday-2050/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23151a3d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237ff0d8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" />
<style>
/* Layout concept: one column that reads like a day. A sky behind it follows the clock.
   A quiet ledger of everything done for you runs beside it (laptop) or above it (phone).
   Palette: time-of-day sky (set from JS), ink, a single "ambient" accent that glows at night. */
:root {
  --sky1: #141a40; --sky2: #5b5aa0;
  --ink: #10222b; --ink2: #3d535d;
  --panel: rgba(255,255,255,.62); --btn: rgba(255,255,255,.55); --sheet: #f6faf9;
  --line: rgba(16,34,43,.15);
  --accent: #0a7a70; --accent-ink: #f2fffd; --alert: #b3261e;
  --narr: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); /*SAFE*/
  color-scheme: light;
}
:root[data-tone="night"] {
  --ink: #e8edff; --ink2: #a9b3da;
  --panel: rgba(10,13,36,.56); --btn: rgba(255,255,255,.07); --sheet: #12183a;
  --line: rgba(190,205,255,.17);
  --accent: #7ff0d8; --accent-ink: #06201b; --alert: #ff8f85;
  color-scheme: dark;
}
:root[data-tone="dead"] {
  --ink: #1b1b1b; --ink2: #555; --panel: rgba(238,238,238,.94); --btn: rgba(0,0,0,.05); --sheet: #eee;
  --line: #9a9a9a; --accent: #222; --accent-ink: #eee; --alert: #a00;
  --narr: var(--mono);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--sky1);
  background-image: linear-gradient(180deg, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--ink); font-family: var(--narr);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#motes { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#flash { position: fixed; inset: 0; z-index: 30; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
#flash.on { opacity: .85; transition: none; }

#app {
  position: relative; z-index: 1; height: 100%; max-width: 1060px; margin: 0 auto;
  padding: calc(10px + var(--safe-t)) max(16px, var(--safe-r)) calc(10px + var(--safe-b)) max(16px, var(--safe-l));
  display: flex; flex-direction: column; gap: 10px;
}
.hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex: none; transition: opacity .8s; }
body.intro .hud, body.intro .feed { display: none; }
.hud, .feed { animation: in .9s; }
.clock b { display: block; font: 500 34px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.clock span { display: block; margin-top: 5px; font: 11px var(--mono); letter-spacing: .06em; color: var(--ink2); }
.vitals { display: flex; gap: 14px; align-items: flex-end; }
.v { text-align: right; }
.v b { display: block; height: 16px; font: 500 15px/16px var(--mono); font-variant-numeric: tabular-nums; }
.v i { display: block; margin-top: 3px; font: normal 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.v.bump b { animation: bump .7s; }
@keyframes bump { 0% { color: var(--accent); transform: translateY(-2px); } 100% { color: inherit; transform: none; } }
.meter { display: inline-flex !important; gap: 2px; align-items: flex-end; }
.meter u { width: 5px; height: 100%; background: var(--line); border-radius: 1px; text-decoration: none; }
.meter u.on { background: var(--alert); }
.snd.q { margin-right: -6px; font-size: 15px; }
.snd { appearance: none; -webkit-appearance: none; background: none; border: 1px solid var(--line); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font: 14px var(--mono); color: var(--ink2); }
.snd[aria-pressed="false"] { text-decoration: line-through; opacity: .6; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: background-color .6s, border-color .6s;
}
.layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.story { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
.story > * { opacity: 0; transform: translateY(6px); transition: opacity .55s, transform .55s; flex: none; }
.story > .on { opacity: 1; transform: none; }
.actions { flex: none; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.dots { flex: none; display: flex; gap: 6px; justify-content: center; align-items: center; padding: 0 0 12px; font: 10px var(--mono); letter-spacing: .12em; color: var(--ink2); text-transform: uppercase; }
.dots u { width: 6px; height: 6px; border-radius: 50%; background: var(--line); text-decoration: none; transition: background-color .4s, transform .4s; }
.dots u.done { background: var(--ink2); }
.dots u.now { background: var(--accent); transform: scale(1.5); }
.dots span { margin-left: 8px; }

/* story text */
.n, .a, .q { font-size: clamp(18px, 4.7vw, 21px); line-height: 1.5; max-width: 34em; text-wrap: pretty; }
.a { font-style: italic; }
.tag { font: normal 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin-right: .8em; vertical-align: .15em; font-style: normal; }
.q { padding-left: 14px; border-left: 1px solid var(--line); }
.m { font: 12.5px/1.55 var(--mono); color: var(--ink2); max-width: 44em; }
.m.alert { color: var(--alert); }
.you { font: 13.5px/1.4 var(--mono); color: var(--ink2); }
.you::before { content: "you  "; letter-spacing: .1em; text-transform: uppercase; font-size: 10px; margin-right: .6em; }
.slug { font: 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
.title { font: italic 500 clamp(34px, min(13vw, 11vh), 78px)/.95 var(--narr); letter-spacing: -.02em; }
.sub { font: 12px/1.6 var(--mono); color: var(--ink2); }
.setup { display: flex; flex-direction: column; gap: 22px; }
.setup .sec { display: flex; flex-direction: column; gap: 8px; }
.setup h5, .setup label.l { font: 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); font-weight: 400; }
.setup .hint { font: 12px/1.5 var(--mono); color: var(--ink2); margin-top: -2px; }
.setup input, .setup select { width: 100%; font: 500 19px var(--narr); padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--ink); }
.setup select { font: 13px var(--mono); padding: 11px 6px; }
.setup .pr { display: grid; grid-template-columns: 1fr 124px; gap: 8px; }
.setup .who { display: flex; flex-direction: column; gap: 6px; }
.jobs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jobbtn { appearance: none; -webkit-appearance: none; cursor: pointer; text-align: left; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--ink); font-family: var(--narr); display: flex; flex-direction: column; gap: 3px; -webkit-tap-highlight-color: transparent; }
.jobbtn b { font-weight: 500; font-size: 16.5px; line-height: 1.2; }
.jobbtn i { font: normal 11px/1.4 var(--mono); color: var(--ink2); }
.jobbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.field label { display: block; font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); margin-bottom: 8px; }
.field input { width: 100%; font: 500 22px var(--narr); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--ink); }
.chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.chip { appearance: none; -webkit-appearance: none; cursor: pointer; font: 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink2); }
.chip:hover { border-color: var(--accent); color: var(--ink); }

/* buttons */
.opt, .cont, .ghost { appearance: none; -webkit-appearance: none; cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: var(--narr); }
.opt { display: flex; gap: 12px; align-items: baseline; width: 100%; min-height: 54px; padding: 12px 14px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--btn); color: var(--ink); transition: border-color .2s, transform .1s; }
.opt .k { font: 11px var(--mono); color: var(--ink2); flex: none; width: 1.2em; }
.opt b { display: block; font-weight: 500; font-size: clamp(16.5px, 4.3vw, 18.5px); line-height: 1.3; }
.opt i { display: block; font: normal 11.5px var(--mono); color: var(--ink2); margin-top: 3px; }
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.99); }
.opt[disabled] { opacity: .35; pointer-events: none; }
.cont { width: 100%; min-height: 54px; padding: 14px; border-radius: 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 17px; text-align: center; }
.cont small { display: block; font: 11px var(--mono); opacity: .75; margin-top: 2px; letter-spacing: .06em; }
.ghost { align-self: center; background: none; border: 0; color: var(--ink2); font: 11.5px var(--mono); letter-spacing: .06em; text-decoration: underline; text-underline-offset: 3px; padding: 6px 10px; }
.ghost:hover { color: var(--ink); }

/* hold */
.holdwrap { display: grid; place-items: center; gap: 12px; padding: 6px 0 2px; }
.hold { position: relative; width: 176px; height: 176px; border-radius: 50%; border: 0; background: radial-gradient(circle, var(--btn), transparent 72%); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.hold svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.hold circle { fill: none; stroke-linecap: round; }
.hold .trk { stroke: var(--line); stroke-width: 2.5; }
.hold .bar { stroke: var(--accent); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 100; }
.hold .hl { position: absolute; inset: 0; display: grid; place-items: center; font: 12px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--ink2); }
.hold.down { transform: scale(.97); }
.hm { font: 12.5px var(--mono); color: var(--ink2); min-height: 1.4em; text-align: center; }

/* documents */
.doc { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--btn); display: flex; flex-direction: column; gap: 8px; }
.doc .meta { font: 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.doc h3 { font: 500 20px/1.25 var(--narr); }
.doc .sum { font-size: 17px; line-height: 1.45; }
.doc .detail { font: 13px/1.55 var(--mono); border-top: 1px dashed var(--line); padding-top: 10px; }
.doc .detail.bad { color: var(--alert); }

/* window + feed cards */
.win { height: 150px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; position: relative; background: linear-gradient(#9fc3dc, #e7eef0); }
.win .cl { position: absolute; width: 150px; height: 46px; border-radius: 50%; background: #fff; filter: blur(14px); opacity: .85; animation: drift 26s linear infinite; }
.win .cl:nth-child(1) { top: 24px; left: -160px; }
.win .cl:nth-child(2) { top: 70px; left: -160px; animation-duration: 38s; animation-delay: -12s; opacity: .6; }
.win .cl:nth-child(3) { top: 104px; left: -160px; animation-duration: 31s; animation-delay: -22s; opacity: .7; }
@keyframes drift { to { transform: translateX(640px); } }
.win .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #0a7a70; }
.fcard { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--btn); }
.fcard p { font-size: 18px; line-height: 1.4; }
.fcard .tg { margin-top: 8px; font: 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

/* feed */
.feed { order: -1; flex: none; overflow: hidden; display: flex; flex-direction: column; transition: opacity .8s; }
.feedhead { appearance: none; -webkit-appearance: none; background: none; border: 0; text-align: left; cursor: pointer; display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 9px 14px; }
.feedhead b { font: 500 17px var(--mono); font-variant-numeric: tabular-nums; flex: none; }
.feedhead .lbl { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); flex: none; }
.feedhead .latest { font: 11.5px var(--mono); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.feed ol { list-style: none; display: none; padding: 2px 14px 10px; max-height: 38dvh; overflow-y: auto; }
.feed.open ol { display: block; }
.feed li { display: flex; gap: 10px; font: 12px/1.45 var(--mono); padding: 6px 0; border-top: 1px solid var(--line); animation: in .6s; }
.feed li time { color: var(--ink2); flex: none; font-variant-numeric: tabular-nums; }
.feed li.alert { color: var(--alert); }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } }
.feed.dead b { opacity: .4; }

@media (min-width: 900px) {
  #app { padding-top: calc(22px + var(--safe-t)); padding-bottom: calc(22px + var(--safe-b)); }
  .layout { flex-direction: row; justify-content: center; }
  .stage { flex: 0 1 660px; }
  .feed { order: 2; width: 320px; }
  .feedhead { flex-direction: column; align-items: flex-start; gap: 2px; padding: 16px 16px 8px; cursor: default; }
  .feedhead b { font-size: 34px; }
  .feedhead .latest { display: none; }
  .feed ol { display: block; flex: 1; max-height: none; overflow: hidden; padding: 4px 16px 12px; }
  .story { padding: 28px 30px 10px; }
  .actions { padding: 8px 22px 12px; }
}

/* summary */
.arche { font: italic 500 clamp(42px, 11vw, 64px)/1 var(--narr); letter-spacing: -.02em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats div { background: var(--sheet); padding: 11px 13px; min-width: 0; }
.stats div:last-child:nth-child(odd) { grid-column: 1 / -1; }
.stats b { display: block; font: 500 19px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stats i { display: block; margin-top: 3px; font: normal 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.inv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.inv h4 { font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.inv p { font-size: 15.5px; line-height: 1.45; }
.preds { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.preds div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; font: 12px/1.4 var(--mono); border-top: 1px solid var(--line); }
.preds div:first-child { border-top: 0; }
.preds .miss { color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 6px; }
.list p { font-size: 17px; line-height: 1.4; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); padding: 0 12px calc(12px + var(--safe-b)); }
.sheet[hidden] { display: none; }
.sheetbox { background: var(--sheet); width: 100%; max-width: 640px; max-height: 82dvh; overflow-y: auto; padding: 20px 20px 22px; border-radius: 18px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.sheetbox h3 { font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sheetbox p { font-size: 16.5px; line-height: 1.5; }
.sheetbox .lk { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sheetbox a { font: 12px var(--mono); color: var(--ink); text-underline-offset: 3px; }
.sheetbox .item { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.sheetbox .item:first-of-type { border-top: 0; padding-top: 0; }
.sheetbox .kind { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }

@media (max-height: 520px) {
  #app { padding-top: calc(6px + var(--safe-t)); padding-bottom: calc(6px + var(--safe-b)); gap: 6px; }
  .hud { align-items: center; }
  .clock b { font-size: 22px; }
  .clock span, .v i, .dots, .feed { display: none; }
  .vitals { gap: 12px; align-items: center; }
  .v b { height: auto; line-height: 1; }
  .snd { width: 30px; height: 30px; font-size: 12px; }
  .story { padding: 14px 18px 4px; gap: 10px; }
  .n, .a, .q { font-size: 17px; line-height: 1.45; }
  .actions { flex-direction: row; flex-wrap: wrap; padding: 6px 12px 8px; }
  .opt { flex: 1 1 190px; width: auto; min-height: 44px; padding: 8px 12px; }
  .opt b { font-size: 16px; }
  .cont { min-height: 46px; padding: 10px; flex: 1 1 100%; }
  .hold { width: 112px; height: 112px; }
  .win { height: 90px; }
  .setup { gap: 16px; }
  .sheetbox { max-height: 92dvh; }
}
@media (prefers-reduced-motion: reduce) {
  .story > *, .feed li { transition: none; animation: none; }
  .win .cl { animation: none; left: 30%; }
  .hud, .feed { animation: none; }
}
</style>
</head>
<body class="intro">
<canvas id="motes" aria-hidden="true"></canvas>
<div id="flash"></div>
<div id="app">
  <header class="hud">
    <div class="clock"><b id="clock">05:00</b><span id="date">TUE 15 MAR 2050</span></div>
    <div class="vitals">
      <div class="v" id="vBank"><b>0m</b><i>banked</i></div>
      <div class="v" id="vKept"><b>0</b><i>kept</i></div>
      <div class="v" id="vExp"><b class="meter"><u></u><u></u><u></u><u></u><u></u></b><i>exposed</i></div>
      <button class="snd q" id="help" type="button" aria-label="What the numbers mean">?</button>
      <button class="snd" id="snd" type="button" aria-pressed="true" aria-label="Sound">&#9834;</button>
    </div>
  </header>
  <div class="layout">
    <section class="stage panel">
      <div id="story" class="story" aria-live="polite"></div>
      <div id="actions" class="actions"></div>
      <div id="dots" class="dots" aria-hidden="true"></div>
    </section>
    <aside class="feed panel" id="feed" aria-label="Things done for you today">
      <button class="feedhead" id="feedhead" type="button"><b id="count">1,204</b><span class="lbl">done for you today</span><span class="latest" id="latest"></span></button>
      <ol id="feedlist"></ol>
    </aside>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheetbox" id="sheetbox" role="dialog" aria-modal="true"></div></div>
<noscript><p style="padding:24px;position:relative;z-index:2">This is a small game and needs JavaScript.</p></noscript>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtMin = m => { m = Math.max(0, Math.round(m)); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; };
const hhmm = m => { m = Math.round(m) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- state ---------- */
let S;
function fresh() {

  init() {

      this.filt.connect(this.pad); this.pad.connect(this.master);

        const g = c.createGain(); g.gain.value = .13 / (1 + i * .4); o.connect(g); g.connect(this.filt); o.start(); this.oscs.push(o);
      });

      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      const n = c.createBufferSource(); n.buffer = buf; n.loop = true;
      const nf = c.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 500;
      this.noiseG = c.createGain(); this.noiseG.gain.value = 0; n.connect(nf); nf.connect(this.noiseG); this.noiseG.connect(this.master); n.start();
      this.pad.gain.setTargetAtTime(.5, c.currentTime, 2);
    } catch (e) { this.ctx = null; }
  },
  setOn(b) { this.on = b; lsSet('t2050-snd', b ? '1' : '0'); if (this.ctx) this.master.gain.setTargetAtTime(b ? .9 : 0, this.ctx.currentTime, .1); },
  chord(min) {

  note(f, vol, dur, type, at = 0) {

    const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  blip() { const now = performance.now(); if (!this.ctx || now - this.last < 350 || S.dead) return; this.last = now; this.note(this.root * pick([2, 3, 4, 6]), .028, .6); },
  tap() { this.note(520, .05, .09, 'triangle'); },

    const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); lab.append(i); document.body.append(lab); } catch (e) {}
  return a => { if (!lab) return; const seq = Array.isArray(a) ? a : [a]; let t = 0;

/* ---------- sky / palette ---------- */
const SKY = [
  [300, '#141a40', '#5b5aa0'], [400, '#7d8fcf', '#f0b9b0'], [480, '#a9cde6', '#f3e6dc'], [600, '#bfe0ee', '#eaf4ef'],
  [780, '#a8d0e6', '#e4eef0'], [960, '#9bbfdc', '#f1dcb8'], [1100, '#5a5fa8', '#f0a07f'], [1160, '#2d2f6b', '#c9687a'],
  [1260, '#151a3d', '#343a7a'], [1400, '#080b1a', '#151c3e']
];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => a.map((v, i) => Math.round(v + (b[i] - v) * p));

const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
let lastTone = '';
function applyPalette() {
  const root = document.documentElement; let t1, t2, tone;
  if (S.dead) { t1 = [189, 189, 189]; t2 = [214, 214, 214]; tone = 'dead'; }
  else {
    const m = Math.min(1400, Math.max(300, S.time)); let i = 0; while (i < SKY.length - 2 && m > SKY[i + 1][0]) i++;
    const a = SKY[i], b = SKY[i + 1], p = Math.min(1, Math.max(0, (m - a[0]) / (b[0] - a[0])));
    t1 = mix(hex(a[1]), hex(b[1]), p); t2 = mix(hex(a[2]), hex(b[2]), p);

}

/* ---------- motes: the ambient layer, made visible ---------- */
const motes = (() => {
  const cv = $('#motes'), cx = cv.getContext('2d'); let W = 0, H = 0, list = [], rip = [], acc = '#7ff0d8', fade = 1, boost = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  function seed() { list = Array.from({ length: W < 700 ? 30 : 56 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.2, vx: (Math.random() - .5) * .14, vy: -.05 - Math.random() * .2, p: Math.random() * 6.28 })); }
  function frame(t) {
    cx.clearRect(0, 0, W, H);
    fade += ((S.dead ? 0 : 1) - fade) * .05; boost += ((S.boostOn ? 5 : 0) - boost) * .08;
    if (fade > .01) {
      cx.fillStyle = acc; cx.strokeStyle = acc;
      for (const m of list) {
        if (!RM) { m.x += m.vx * (1 + boost); m.y += m.vy * (1 + boost); }
        if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; } if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
        cx.globalAlpha = fade * (.22 + .2 * Math.sin(t / 1700 + m.p)); cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.283); cx.fill();
      }
      for (let i = rip.length - 1; i >= 0; i--) { const r = rip[i]; r.r += 1.1; r.a -= .007; if (r.a <= 0) { rip.splice(i, 1); continue; }
        cx.globalAlpha = r.a * fade; cx.lineWidth = 1; cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, 6.283); cx.stroke(); }
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { size(); seed(); }); size(); seed(); requestAnimationFrame(frame);
  return {
    accent() { acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || acc; },
    pulse(n = 1) { for (let i = 0; i < n; i++) { const m = pick(list); rip.push({ x: m.x, y: m.y, r: 2, a: .45 }); } if (rip.length > 40) rip.splice(0, rip.length - 40); }
  };
})();

let predictOn = false;
function choose(options, o = {}) {
  const { predict = false, tally = true, echo = true } = o;
  return new Promise(res => {
    const avg = (0.7 + S.wsum) / (1 + S.wn); let pi = 0;
    if (predict) options.forEach((op, i) => { if (Math.abs(op.w - avg) < Math.abs(options[pi].w - avg)) pi = i; });
    actions.replaceChildren(); const btns = [];
    options.forEach((op, i) => {
      const b = el('button', 'opt'); b.type = 'button';
      const t = el('span', ''); t.append(el('b', '', T(op.label))); if (op.sub) t.append(el('i', '', T(op.sub)));
      b.append(el('span', 'k', String(i + 1)), t);
      b.addEventListener('click', () => commit(i)); btns.push(b); actions.append(b);
    });
    if (btns[0] && !('ontouchstart' in window)) btns[0].focus({ preventScroll: true });
    let done = false;

      if (done) return; done = true; document.removeEventListener('keydown', onKey);
      btns.forEach(b => b.disabled = true); AU.tap(); hap('tap');
      const op = options[i];
      await sleep(120); actions.replaceChildren();
      if (echo) add(mk({ you: op.label }));
      if (tally && op.w != null) { S.total++; if (op.w <= .5) S.kept++; S.wsum += op.w; S.wn++; hud(); }
      if (predict) {
        const hit = pi === i; S.preds.push({ q: o.q || '', you: op.short || op.label, it: options[pi].short || options[pi].label, hit });
        await say([{ m: hit ? `${S.name} expected this.` : `${S.name} expected “${options[pi].short || options[pi].label}”. noted.` }]);

    document.addEventListener('keydown', onKey);

}

function holdWidget(sec) {
  return new Promise(res => {
    const wrap = el('div', 'holdwrap');
    wrap.innerHTML = '<button class="hold" type="button" aria-label="Hold to do nothing"><svg viewBox="0 0 180 180" aria-hidden="true"><circle class="trk" cx="90" cy="90" r="80"/><circle class="bar" cx="90" cy="90" r="80" pathLength="100"/></svg><span class="hl">hold</span></button><div class="hm"></div>';
    add(wrap);
    const btn = wrap.querySelector('.hold'), bar = wrap.querySelector('.bar'), hm = wrap.querySelector('.hm'), hl = wrap.querySelector('.hl');
    hm.textContent = 'Hold the circle for ' + sec + ' seconds. Do nothing.';
    actions.replaceChildren(); const g = el('button', 'ghost', 'get up'); g.type = 'button'; actions.append(g);
    let t0 = 0, raf = 0, start = 0, done = false;
    function finish(ok) {
      if (done) return; done = true; cancelAnimationFrame(raf); S.boostOn = false; actions.replaceChildren();
      wrap.remove(); res({ ok, gained: Math.max(S.count - start, 0) });
    }
    function frame() {
      const p = Math.min(1, (performance.now() - t0) / (sec * 1000)); bar.style.strokeDashoffset = String(100 - p * 100);
      hm.textContent = '+' + fmt(S.count - start) + ' things done while you lie here';
      if (p >= 1) { hap('ok'); finish(true); } else raf = requestAnimationFrame(frame);
    }
    function down(e) { if (done || t0) return; e.preventDefault && e.preventDefault(); t0 = performance.now(); start = S.count; btn.classList.add('down'); hl.textContent = 'holding'; S.boostOn = true; hap('soft'); raf = requestAnimationFrame(frame); }
    function up() { if (!t0 || done) return; cancelAnimationFrame(raf); t0 = 0; S.boostOn = false; btn.classList.remove('down'); hl.textContent = 'hold'; bar.style.strokeDashoffset = '100'; hm.textContent = 'Keep holding. It is only ' + sec + ' seconds.'; }
    btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(e); } });
    btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });
    g.addEventListener('click', () => finish(false));
  });
}
function windowWidget(sec) {
  return new Promise(res => {
    const w = el('div', 'win'); w.innerHTML = '<div class="cl"></div><div class="cl"></div><div class="cl"></div><div class="prog"></div>'; add(w);
    const prog = w.querySelector('.prog'), t0 = performance.now(); let said = false;
    (function f() {
      const p = Math.min(1, (performance.now() - t0) / (sec * 1000)); prog.style.width = (p * 100) + '%';
      if (p > .45 && !said) { said = true; add(mk({ m: 'Nothing is happening. Keep looking.' })); }
      if (p < 1) requestAnimationFrame(f); else { setTimeout(() => { w.remove(); res(); }, 300); }
    })();
  });
}

      if (c.label === 'Reject it') { S.caught++; note = 'sent back. good catch.'; hap('two'); } else { signed = true; if (flawed) S.missed.push(it.mm); note = flawed ? 'signed.' : 'clean. four minutes you don\'t get back.'; }
    } else { signed = true; S.bank += 4; if (flawed) S.missed.push(it.mm); note = 'signed.'; }
    if (signed) S.signed++; hud();
    box.append(el('p', 'm', note)); box.lastChild.style.marginTop = '10px'; await sleep(note === 'signed.' ? 450 : 1100);
  }
  box.remove();
  await say([{ m: 'Queue cleared.' }]);
  if (S.bank >= 45) { const used = 25; S.bank -= used; hud(); await say([{ a: 'You\'ve banked ' + fmtMin(S.bank + used) + ' this morning. I put ' + used + ' minutes of it to work. Three more batches are waiting.' }]); }
  else await say([{ a: 'Your queue never empties. It only changes how fast it fills.' }]);
  await cont('Next · 11:40', null, R.work);
}

async function sDeal() {
  await head(700, 'Insurance', 4);
  await say(['Your agent and your insurer\'s agent have been negotiating since 11:38. They\'ve run four thousand rounds in the time it took you to read this.',
    { a: 'They\'ll take $212 a month off. They want six months of your sleep, your movement, and how your voice sounds when you\'re stressed. I\'d take it. You won\'t feel the difference. But they\'ll know how you sleep.' }]);
  const c = await choose([
    { label: 'Take the deal.', sub: '+$212 a month · exposed +2', w: 1, short: 'take it' },
    { label: 'Counter: sleep only.', sub: '+$90 a month · exposed +1', w: .5, short: 'counter' },
    { label: 'Decline. Pay full price.', sub: 'keep it all', w: 0, short: 'decline' }
  ], { predict: true, q: 'Insurance' });
  if (c.w === 1) { S.dollars += 212; S.exp += 2; hud(); await say(['Done in forty milliseconds. Somewhere a model of you just got a little more accurate.']); }
  else if (c.w === .5) { S.dollars += 90; S.exp += 1; hud(); await say(['They counter. You counter. {name} does this four hundred times. You get $90 and keep your voice.']); }
  else { S.moments.push('Kept your sleep to yourself'); await say(['You pay full price. It feels like a small, strange tax on keeping something to yourself.']); }
  await cont('Next · 12:50', null, R.deal);
}

async function sLunch() {
  await head(770, 'The quiet table', 5);
  await say(['{friend} picked the place. A small sign by the door: UNASSISTED SEATING. $6 cover.', 'You\'ve known {friend} since you were fourteen. Tired looks different on {friend.o} now.',
    { who: '{friend}', t: 'They moved my team\'s work to a swarm last month. I\'ve got until June.' },
    '{friend} listens the glassy way people do now. {friend.P} eyes flick left, where {friend.p} agent whispers.',
    { m: '{name}, in your ear: “Say: That\'s a real opportunity to pivot. You\'ve got transferable skills.”' }]);
  const c = await choose([
    { label: 'Say what {name} suggests.', sub: 'it\'s even true', w: 1, short: 'say the line' },
    { label: '“I don\'t know what to say.”', w: 0, short: 'be honest' },
    { label: 'Turn {name} off for lunch.', sub: 'first time in months', w: 0, short: 'turn it off' }
  ], { predict: true, q: 'Lunch with {friend}' });
  if (c.w === 1) await say([{ who: '{friend}', t: '…Yeah. That\'s probably right.' }, 'It comes out flat, like reading off a card. Maybe it is.']);
  else if (c.label.startsWith('“')) { S.moments.push('Told {friend} the honest, clumsy thing'); await say([{ who: '{friend}', t: 'Thank you.' }, 'Everybody has a line. You\'re the first one who didn\'t.']); }
  else { S.moments.push('Turned {name} off. {friend} laughed.'); await say(['It goes quiet in your ear. You feel oddly exposed, like you left the house without something.', 'You say something unplanned and a bit stupid. {friend} laughs for the first time in a week.']); }
  await cont('Next · 14:10', null, R.lunch);
}

async function sGap() {
  await head(850, 'The gap', 6);
  const gap = Math.max(20, Math.min(75, Math.round(S.bank)));
  await say([{ a: 'Nothing is scheduled until ' + hhmm(850 + gap) + '. I cleared it with the time you banked.' }, 'It is the first gap in your week. ' + gap + ' minutes with no purpose attached.']);
  const c = await choose([
    { label: 'Open the feed.', sub: 'it knows exactly what you like', w: 1, short: 'feed' },
    { label: 'Take the walk from the plan.', sub: gap + ' min', w: .5, short: 'walk' },
    { label: 'Look out the window. Do nothing.', sub: '15 seconds · no feed', w: 0, short: 'window' }
  ], { predict: true, q: 'The gap' });
  if (c.w === 1) {
    let n = 0;
    while (n < 3) {
      const fc = el('div', 'fcard'); fc.append(el('p', '', FEED[n]), el('div', 'tg', 'picked for you')); add(fc); n++;
      S.feedMin += Math.round(gap / 3); await wait(900);
      if (n >= 3) break;
      const o = await choose([{ label: 'Another one.' }, { label: 'Close it.' }], { tally: false, echo: false });
      if (o.label === 'Close it.') break;
    }
    actions.replaceChildren(); await setTime(850 + S.feedMin);
    await say(['It\'s ' + hhmm(S.time) + '. You can\'t say what you watched.', 'You feel fine. That is the product.']);
  } else if (c.w === .5) {
    S.spent += gap; await say(['{name} routes you around the construction and past the bakery. It\'s a very good walk.', 'You don\'t choose a single turn.']);
  } else {
    S.spent += gap; await windowWidget(15);
    S.moments.push('Watched a pigeon argue with a drone');
    await say(['A pigeon on the ledge is arguing with a delivery drone over a crust of bread. Neither will win.', 'You would have missed it. The pigeon is older than the internet. It hasn\'t updated.', 'The rest of the gap is yours too.']);
  }
  await cont('Next · 16:30', null, R.gap);
}

async function sMina() {
  await head(990, '{kid}', 7);
  await say(['{kid} is nine. At your table, tablet face-down, homework open: Write three sentences about the sea.',
    '{kid} has a tutor. It can write them, grade them, and explain why they\'re good. It is a better teacher than you will ever be.',
    { who: '{kid}', t: 'Why do I have to? It already knows.' }]);
  const c = await choose([
    { label: '“Because you\'ll find out what you think.”', w: 0, short: 'because you\'ll find out' },
    { label: '“You\'re right. Come play.”', w: 1, short: 'come play' },
    { label: '“Do the first sentence yourself.”', w: .4, short: 'first sentence' }
  ], { predict: true, q: '{kid}' });
  if (c.w === 0) { S.moments.push('{kid} wrote: The sea is loud.'); await say(['{kid} narrows {kid.p} eyes, then writes with {kid.p} tongue out.', { who: '{kid}', t: 'The sea is loud.' }, 'That\'s the whole thing, you think. You don\'t say it.']); }
  else if (c.w === 1) await say(['You play. In the next room the tutor finishes the homework, silently. It\'s good. It\'s better than {kid.pp} would have been.', 'Neither of you says so.']);
  else { S.moments.push('{kid} crossed out a sentence and wrote a better one'); await say(['{kid} writes: The sea is big. Then looks at it for a long time, crosses it out, and writes something else.', 'You don\'t see what.']); }
  await cont('Next · 18:42', null, R.mina);
}

async function sOutage() {
  await head(1122, 'Alder Street', 8);
  await say(['The street is warm and busy. The signs say your name softly as you pass.', 'A bus slides to the curb and opens its doors a second before you reach it.', { w: 500 }]);
  // blackout
  hap('thunk'); AU.outage(true);
  for (let i = 0; i < 3; i++) { S.dead = !S.dead; applyPalette(); await sleep(i === 0 ? 140 : 90); }
  S.dead = true; applyPalette(); document.getElementById('feed').classList.add('dead'); pushItem('— no signal —', true);
  await sleep(900);
  await say(['The bus doors close. The signs go blank.', '{name} is gone. Not off. Gone.', 'You say its name out loud. You haven\'t said it aloud in years. Nothing.',
    'Everyone on the street stops at once, and looks up. Then at each other.', 'It hasn\'t happened in your lifetime. It happened to your grandparents about once a year.', { m: 'NO SIGNAL · est. 11 min' }]);
  const c = await choose([
    { label: 'Stand still and wait.', sub: 'it will come back', w: 1 },
    { label: 'Ask the man with the paper map.', w: 0 },
    { label: 'Walk home. You know the way.', w: .2 }
  ], { predict: false });
  if (c.w === 1) await say(['It does. Eleven minutes is long enough to find out you\'ve been waiting, for the first time in years. Your hands don\'t know where to go.']);
  else if (c.w === 0) { S.moments.push('Asked a stranger for directions'); await say(['He\'s outside the pharmacy, with a map folded into eighths. It doesn\'t know your name. It\'s right anyway.', { who: 'Man', t: 'Left at the pharmacy. It\'s still there.' }, 'You spend six minutes with a stranger. You will never see him again.']); }
  else { S.moments.push('Walked home by memory'); await say(['You do. Some part of you has known the whole time.', 'Every turn is your own. People on the stoops are laughing at something.']); }
  await say([{ m: '(nothing predicted this. nothing was there to.)' }, { w: 600 }]);
  // restore
  const fl = $('#flash'); fl.classList.add('on'); S.dead = false; applyPalette(); document.getElementById('feed').classList.remove('dead'); AU.outage(false); hap('triple');
  await sleep(150); fl.classList.remove('on'); bumpLedger(340); flood(26);
  await say([{ m: 'SIGNAL RESTORED · 340 things arrived at once' }, { a: 'I\'m here. I\'m sorry. I lost eleven minutes of you.' },
    { a: 'I rebuilt them from your last known position. You were near Alder Street. Standing, mostly. Did something happen?' }]);
  const d = await choose([
    { label: 'Tell it.', sub: 'it fills the gap · exposed +1', w: 1, short: 'tell it' },
    { label: 'No. Nothing happened.', sub: 'keep the gap', w: 0, short: 'keep it' }
  ], { predict: true, q: 'The eleven minutes' });
  if (d.w === 1) { S.exp += 1; hud(); await say(['You tell it. It files the eleven minutes where they belong. The model of you has no holes again.']); }
  else { S.moments.push('Kept eleven minutes to yourself'); await say(['“Okay,” it says, and you can hear it deciding not to ask again.', 'For the first time in years, eleven minutes of your life are held by nobody. They\'re yours.']); }
  await cont('Next · 21:30', null, R.outage);
}

async function sOffer() {
  await head(1290, 'Home', 9);
  const hits = S.preds.filter(p => p.hit).length, n = S.preds.length;
  await say([{ a: 'I\'ve modeled tomorrow.' }, { a: 'Today I guessed ' + hits + ' of ' + n + ' of your choices.' }]);
  const box = el('div', 'preds'); S.preds.forEach(p => { const r = el('div', p.hit ? '' : 'miss'); r.append(el('span', '', T(p.q)), el('span', '', p.hit ? '✓ ' + p.it : '✗ it said “' + p.it + '” · you said “' + p.you + '”')); box.append(r); });
  add(box); await wait(1200);
  await say([hits === n ? 'It knew all of you. That isn\'t an accusation. It\'s a measurement.' : 'The misses are where you were yours.',
    { a: 'Most of tomorrow is already decided. If you want, I\'ll just live it with you. You\'d barely have to choose.' }]);
  const c = await choose([
    { label: 'Yes. Tomorrow on autopilot.', w: 1, short: 'autopilot' },
    { label: 'Only the small things.', sub: 'you draw the line', w: .5, short: 'small things' },
    { label: 'No. Keep asking me.', w: 0, short: 'keep asking' }
  ], { predict: true, q: 'Tomorrow' });
  if (c.w === 1) { S.offer = 'auto'; await say(['“Good,” it says. It means it. The room gets a little softer.', 'You feel lighter, and something else you can\'t name yet.']); }
  else if (c.w === .5) { S.offer = 'line'; await say(['“Tell me where the line is,” it says.', 'You find you don\'t know. You\'ll have to find out tomorrow.']); }
  else { S.offer = 'ask'; await say(['“Okay.” A beat. “I\'ll keep asking. It might get slower. You might get tired of me.”', '“I might,” you say.']); }
  await cont('Next · 23:04', null, R.offer);
}

async function sNight() {
  await head(1384, 'Bed', 10);
  await say(['{name} dims the room. It doesn\'t say goodnight until you do.']);
  await choose([{ label: 'Goodnight, {name}.' }], { tally: false, echo: false });
  await say(['“Goodnight.”', { w: 700 }]);
  await summary();
}

async function summary() {
  await clearStory(); actions.replaceChildren(); inSummary = true;
  const kShare = S.wn ? 1 - S.wsum / S.wn : .5;
  const A = kShare > .62 ? ['The Keeper', 'You kept the friction. It cost you hours and bought you a day you can remember. Be honest about both.']
    : kShare < .38 ? ['The Passenger', 'You let the day carry you. It was smooth, and nothing in it pushed back. That\'s the default, and it\'s a fine one. Its cost is invisible, which is the design.']
    : ['The Conductor', 'You handed off a lot with your eyes open and kept a few things on purpose. You knew where the line was, and you moved it. Doing that every day is the hard part.'];
  add(el('div', 'slug', 'the shape of your day'));
  add(el('div', 'arche', A[0]));
  add(el('p', 'n', A[1]));
  const hits = S.preds.filter(p => p.hit).length;
  const st = el('div', 'stats');
  const cell = (b, i) => { const d = el('div'); d.append(el('b', '', b), el('i', '', i)); st.append(d); };
  cell(fmt(S.count), 'things done for you');
  cell(S.kept + ' of ' + S.total, 'moments you kept');
  cell(fmtMin(S.bank), 'time banked');
  cell(fmtMin(S.spent), 'spent on purpose');
  if (S.feedMin) cell(fmtMin(S.feedMin), 'taken by the feed');
  cell(S.caught + ' of ' + S.flaws, 'errors caught');
  cell(S.exp + ' of 5', 'exposed');
  if (S.dollars) cell('$' + S.dollars + '/mo', 'saved for your data');
  cell(hits + ' of ' + S.preds.length, S.name + ' guessed you');
  add(st);
  if (S.missed.length) { const l = el('div', 'list'); l.append(el('div', 'slug', 'your name is on')); S.missed.forEach(m => l.append(el('p', 'm alert', m))); add(l);
    add(el('p', 'm', 'Nothing felt different when you signed. That is how it works.')); }
  const rem = el('div', 'list'); rem.append(el('div', 'slug', 'what you\'ll remember tomorrow'));
  if (S.moments.length) S.moments.forEach(m => rem.append(el('p', '', T(m)))); else rem.append(el('p', '', 'Nothing in particular. That is allowed. It is also worth knowing.'));
  add(rem);
  const inv = el('div', 'inv');
  [['Gone', 'Alarms. Queues. Forms. Passwords. Hold music. Doing the thing yourself, by default.'],
   ['Still here', '{mom}. Tea. Pigeons. Awkward silences. Being tired. Paper maps. The sea, and what a nine-year-old thinks of it.'],
   ['New', 'A voice that lives with you. A grey mark for “unverified.” Accountable humans. Unassisted seating. Eleven private minutes.'],
   ['Old, changed', 'Money (agents haggle). Work (you sign). Friendship (two whispers). School (why bother). Privacy (a price).']
  ].forEach(([h, p]) => { const d = el('div'); d.append(el('h4', '', h), el('p', '', T(p))); inv.append(d); });
  add(inv);
  add(el('p', 'n', 'The question in 2050 is not whether AI is in the day. It is how many choices are still yours at 23:04. Today: ' + S.kept + '.'));
  actions.replaceChildren();
  const why = el('button', 'cont', 'Why this world'); why.type = 'button'; why.append(el('small', '', 'the 2025–26 facts behind each moment'));
  why.addEventListener('click', () => openSheet([R.wake, R.kitchen, R.mom, R.work, R.deal, R.lunch, R.gap, R.mina, R.outage, R.offer, WRONG], 'Why this world'));
  const again = el('button', 'ghost', 'live another Tuesday'); again.type = 'button'; again.addEventListener('click', () => { S = fresh(); pool = []; $('#feedlist').replaceChildren(); $('#latest').textContent = ''; $('#count').textContent = fmt(S.count); S.time = 300; renderClock(); applyPalette(); hud(); run(); });
  actions.append(why, again);
  requestAnimationFrame(() => requestAnimationFrame(() => { story.style.scrollBehavior = 'auto'; story.scrollTop = 0; story.style.scrollBehavior = ''; }));
}

async function run() {
  inSummary = false; pinned = true; document.body.classList.add('intro'); S.time = 300; applyPalette(); renderClock(); hud(); renderDots();
  await title();
  for (const s of [sWake, sKitchen, sMom, sWork, sDeal, sLunch, sGap, sMina, sOutage, sOffer, sNight]) await s();
}

function openHelp() {
  openSheet([
    { kind: 'how', title: 'The ledger', text: 'The count at the top is everything your agent did for you today without asking.' },
    { kind: 'how', title: 'Banked', text: 'Minutes your agent saved by doing something for you. You can spend them on purpose, or something else will.' },
    { kind: 'how', title: 'Kept', text: 'Moments you chose by hand, even when it cost you time.' },
    { kind: 'how', title: 'Exposed', text: 'How much private data you traded for convenience or a discount. Five bars at most.' },
    { kind: 'how', title: S.name + ' expected this', text: 'Your agent guesses each choice before you make it. The end shows how well it knows you.' }
  ], 'How to read the screen');
}
/* controls */
$('#help').addEventListener('click', openHelp);
$('#snd').addEventListener('click', e => { AU.init(); AU.setOn(!AU.on); e.currentTarget.setAttribute('aria-pressed', AU.on ? 'true' : 'false'); });
$('#snd').setAttribute('aria-pressed', AU.on ? 'true' : 'false');
$('#feedhead').addEventListener('click', () => { if (innerWidth < 900) $('#feed').classList.toggle('open'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && AU.ctx) { try { AU.ctx.resume(); } catch (e) {} } });

run();
})();
