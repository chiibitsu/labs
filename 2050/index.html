<title>What We Kept</title>

<style>
/* Layout: one centred column over a full-bleed sky that follows the clock.
   Human voices and narration in serif, Wren in a soft sans, the world's data in mono.
   Delegating is a glowing one-tap button; doing it yourself is an ink-outlined one that costs time. */
@property --sky1 { syntax: "<color>"; inherits: true; initial-value: #1b2034; }
@property --sky2 { syntax: "<color>"; inherits: true; initial-value: #6b4a58; }
@property --ink { syntax: "<color>"; inherits: true; initial-value: #f3ece5; }
@property --dim { syntax: "<color>"; inherits: true; initial-value: #c3b4b2; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #ffc29b; }

:root {
  --sky1: #1b2034; --sky2: #6b4a58; --ink: #f3ece5; --dim: #c3b4b2; --accent: #ffc29b;
  --line: rgba(243,236,229,.18); --chip: rgba(243,236,229,.07);
  --paper: #f5f0e8; --paper-ink: #221e1b; --paper-dim: #6f665e;
  --old: #8a5527; --new: #2a5c8c; --chg: #4f6a2a;
  --void: #050506; --void-ink: #9a948e;
  --f-prose: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-wren: "Geologica", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-data: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
  transition: --sky1 2.4s ease, --sky2 2.4s ease, --ink .9s ease, --dim .9s ease, --accent .9s ease;
}
:root[data-phase="dawn"]      { --sky1:#1b2034; --sky2:#6b4a58; --ink:#f3ece5; --dim:#c9bab7; --accent:#ffc29b; --line:rgba(243,236,229,.18); --chip:rgba(243,236,229,.07); color-scheme: dark; }
:root[data-phase="morning"]   { --sky1:#e6edf0; --sky2:#f7f0e4; --ink:#1c2230; --dim:#566070; --accent:#2b5f8e; --line:rgba(28,34,48,.16); --chip:rgba(28,34,48,.05); color-scheme: light; }
:root[data-phase="midday"]    { --sky1:#edf3ed; --sky2:#f8f6ef; --ink:#17201c; --dim:#52605a; --accent:#1f6d5b; --line:rgba(23,32,28,.16); --chip:rgba(23,32,28,.05); color-scheme: light; }
:root[data-phase="afternoon"] { --sky1:#f5e8d3; --sky2:#ebcfae; --ink:#2a1f16; --dim:#6b5745; --accent:#96491b; --line:rgba(42,31,22,.17); --chip:rgba(42,31,22,.05); color-scheme: light; }
:root[data-phase="dusk"]      { --sky1:#29233e; --sky2:#86504b; --ink:#f7ece4; --dim:#dcc4ba; --accent:#ffd29a; --line:rgba(247,236,228,.2); --chip:rgba(247,236,228,.08); color-scheme: dark; }
:root[data-phase="night"]     { --sky1:#070a16; --sky2:#18203a; --ink:#e8e5de; --dim:#a2a7b8; --accent:#a9c1ff; --line:rgba(232,229,222,.16); --chip:rgba(232,229,222,.06); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; overflow: hidden;
  background: var(--sky1);
  background-image: linear-gradient(175deg, var(--sky1) 0%, var(--sky2) 100%);
  color: var(--ink); font-family: var(--f-wren); font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, .art:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

#sun {
  position: fixed; z-index: 0; pointer-events: none;
  width: 70vmax; height: 70vmax; border-radius: 50%;
  left: var(--sx, 10%); top: var(--sy, 80%); transform: translate(-50%, -50%);
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 62%);
  opacity: .55; transition: left 3s ease, top 3s ease, opacity 2s ease;
}

#app {
  position: relative; z-index: 1; height: 100%;
  max-width: 580px; margin: 0 auto; padding-inline: 16px;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
}

/* Top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; font-family: var(--f-data); font-size: .72rem; }
.clock { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.clock b { font-size: 1rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-r { display: flex; align-items: center; gap: 6px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); color: var(--ink); cursor: pointer; font-size: .7rem; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: breathe 3.2s ease-in-out infinite; }
.pill.off i { background: var(--dim); box-shadow: none; animation: none; opacity: .5; }
.pill.wren { cursor: default; }
.pill.bump { animation: bump .6s ease; }
@keyframes breathe { 50% { opacity: .35; } }
@keyframes bump { 40% { transform: scale(1.14); } }

/* Wire ticker */
.wire { display: flex; align-items: center; gap: 10px; border-block: 1px solid var(--line); padding-block: 6px; overflow: hidden; font-family: var(--f-data); font-size: .66rem; color: var(--dim); letter-spacing: .02em; }
.wire em { font-style: normal; color: var(--ink); letter-spacing: .14em; flex: none; font-size: .6rem; }
.wire .track { overflow: hidden; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
#tick { display: inline-flex; white-space: nowrap; animation: marquee 40s linear infinite; }
#tick span { padding-right: 2.5em; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* Stage */
#stage { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; padding-block: 22px 18px; scrollbar-width: none; transition: opacity .4s ease; }
#stage::-webkit-scrollbar { display: none; }
#stage.out { opacity: 0; }
#stage > * { animation: rise .55s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.chap { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; }
.chap .t { font-family: var(--f-prose); font-weight: 300; font-size: clamp(3rem, 15vw, 4.4rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chap .pl { font-family: var(--f-data); font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }

.n { font-family: var(--f-prose); font-size: 1.14rem; line-height: 1.55; margin: 0; max-width: 34em; text-wrap: pretty; }
.w { font-family: var(--f-wren); font-weight: 300; font-size: 1.02rem; line-height: 1.5; margin: 0; padding-left: 18px; position: relative; max-width: 32em; }
.w::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.p { font-family: var(--f-prose); font-style: italic; font-size: 1.14rem; line-height: 1.5; margin: 0; max-width: 32em; }
.p .who { display: block; font-family: var(--f-data); font-style: normal; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 1px; }
.p.you { align-self: flex-end; text-align: right; }
.echo { align-self: flex-end; font-family: var(--f-data); font-size: .68rem; color: var(--dim); letter-spacing: .04em; }
.echo::before { content: "→ "; }
.hint { font-family: var(--f-data); font-size: .7rem; line-height: 1.5; color: var(--dim); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; }

ul.sys { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-family: var(--f-data); font-size: .76rem; line-height: 1.5; color: var(--dim); }
ul.sys li { padding-left: 14px; position: relative; animation: rise .35s ease both; }
ul.sys li::before { content: "·"; position: absolute; left: 2px; color: var(--accent); }
ul.sys.num li::before { content: none; }
ul.sys.num li { padding-left: 0; color: var(--ink); font-size: .8rem; }

.art { cursor: pointer; -webkit-tap-highlight-color: transparent; text-decoration: underline dotted 1.5px; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.art.got { text-decoration-style: solid; text-decoration-thickness: 1px; }
.art.got::after { content: "◆"; font-size: .45em; vertical-align: super; margin-left: 2px; color: var(--accent); font-style: normal; }

/* Dock & choices */
#dock { display: grid; gap: 8px; padding-block: 10px 16px; }
#dock:empty { padding-block: 0 10px; }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--chip); font-family: var(--f-wren); font-size: 1rem; transition: transform .15s ease, background .3s ease; }
.ch:active { transform: scale(.985); }
.ch .m { font-family: var(--f-data); font-size: .66rem; color: var(--dim); white-space: nowrap; letter-spacing: .03em; }
.ch.ai { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 24px -10px var(--accent); font-weight: 300; }
.ch.hand { background: transparent; border: 1.5px solid var(--ink); font-family: var(--f-prose); font-size: 1.1rem; }
.ch.small { padding: 10px 14px; font-size: .86rem; justify-content: center; }
.ch:disabled { opacity: .35; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Title */
.title { display: flex; flex-direction: column; gap: 16px; padding-top: 4vh; }
.eyebrow { font-family: var(--f-data); font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
.title h1 { font-family: var(--f-prose); font-style: italic; font-weight: 300; font-size: clamp(3.2rem, 17vw, 5.6rem); line-height: .92; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.title .n { font-size: 1.2rem; }
.meta-note { font-family: var(--f-data); font-size: .68rem; color: var(--dim); line-height: 1.6; }

/* Minigames */
.mini { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 8px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.mini .cap { font-family: var(--f-data); font-size: .7rem; color: var(--dim); text-align: center; }
.cupwrap { position: relative; width: 150px; height: 150px; }
.cup { position: absolute; left: 10px; bottom: 0; width: 110px; height: 130px; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 30px 30px; overflow: hidden; }
.cupwrap::after { content: ""; position: absolute; right: 4px; top: 40px; width: 30px; height: 46px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 22px 22px 0; }
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(#6b4528, #2f1c0e); }
.fill::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: #a87a52; opacity: .7; }
.spill { position: absolute; left: -10px; right: 20px; bottom: -8px; height: 8px; border-radius: 50%; background: #3d2513; opacity: 0; transition: opacity .3s; }
.spill.on { opacity: .8; }
.ch.hold { justify-content: center; padding-block: 20px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.ch.hold.on { background: color-mix(in srgb, var(--ink) 12%, transparent); transform: scale(.98); }

.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { font-family: var(--f-prose); font-size: 1rem; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; text-align: left; }
.tile.on { background: var(--ink); color: var(--sky2); border-color: var(--ink); }
.built { font-family: var(--f-prose); font-style: italic; font-size: 1.16rem; line-height: 1.5; min-height: 3.2em; text-align: center; margin: 0; max-width: 28em; }
.mini.done .tiles { display: none; }

.sigbox { position: relative; width: 100%; }
.sigbox canvas { display: block; width: 100%; height: 170px; border-radius: 14px; border: 1px dashed var(--line); background: var(--chip); touch-action: none; cursor: crosshair; }
.sigbox::before { content: "×"; position: absolute; left: 16px; bottom: 38px; font-family: var(--f-prose); font-size: 1.3rem; color: var(--dim); pointer-events: none; }
.sigbox::after { content: ""; position: absolute; left: 38px; right: 18px; bottom: 44px; border-bottom: 1px solid var(--line); pointer-events: none; }

.walkbar { width: 100%; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-data); font-size: .7rem; color: var(--dim); }
.walkbar .track { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.walkbar .track i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s ease; }
.ch.step { justify-content: center; padding-block: 18px; }

.album { display: flex; justify-content: center; padding-block: 6px 2px; }
.photo { width: min(290px, 100%); background: var(--paper); padding: 10px 10px 12px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.45); transform: rotate(var(--r, -1.5deg)); animation: drop .6s ease both; }
@keyframes drop { from { opacity: 0; transform: rotate(var(--r)) translateY(-14px) scale(.98); } }
.photo .img { aspect-ratio: 4 / 3; width: 100%; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; font-family: var(--f-data); font-size: .66rem; line-height: 1.5; color: rgba(255,255,255,.88); text-shadow: 0 1px 2px rgba(0,0,0,.4); filter: saturate(.7) sepia(.18); }
.photo .yr { font-family: var(--f-prose); font-style: italic; font-size: 1.05rem; color: var(--paper-ink); padding-top: 8px; }

.keep { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.keep label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--chip); font-family: var(--f-prose); font-size: 1.06rem; cursor: pointer; }
.keep input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.keep label.lock { opacity: .7; cursor: default; }
.keep label small { display: block; font-family: var(--f-data); font-size: .64rem; color: var(--dim); }

/* Quiet hour veil */
#veil { position: fixed; inset: 0; z-index: 60; background: var(--void); color: var(--void-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 24px 16px; opacity: 0; transition: opacity 2.2s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#veil.on { opacity: 1; }
.qtext { font-family: var(--f-prose); font-size: 1.28rem; line-height: 1.5; text-align: center; max-width: 24ch; min-height: 4.5em; display: flex; align-items: center; justify-content: center; transition: opacity .8s ease; margin: 0; }
.qtext.fade { opacity: 0; }
.ring { position: relative; width: 140px; height: 140px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 2; }
.ring .bg { stroke: #2a2826; }
.ring .fg { stroke: #cfc8bf; stroke-linecap: round; stroke-dasharray: 427; stroke-dashoffset: calc(427 * (1 - var(--p, 0))); }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-data); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: #8d8780; }
.ring.on span { color: #d8d1c8; }
.qtime { font-family: var(--f-data); font-size: .8rem; font-variant-numeric: tabular-nums; color: #5f5a55; }
.qbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.qbtns button { padding: 12px 18px; border-radius: 999px; border: 1px solid #3a3734; background: transparent; color: #cfc8bf; font-family: var(--f-wren); cursor: pointer; }

/* Sheet */
#scrim { position: fixed; inset: 0; z-index: 70; background: rgba(5,5,8,.45); opacity: 0; transition: opacity .3s ease; }
#scrim.on { opacity: 1; }
#sheet { position: fixed; z-index: 71; left: 50%; bottom: 0; width: min(580px, 100%); transform: translate(-50%, 104%); transition: transform .38s cubic-bezier(.2,.8,.2,1); background: var(--paper); color: var(--paper-ink); border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 82%; overflow-y: auto; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.4); color-scheme: light; }
#sheet.on { transform: translate(-50%, 0); }
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.tag { font-family: var(--f-data); font-size: .62rem; letter-spacing: .18em; padding: 4px 9px; border-radius: 999px; color: #fff; }
.tag.OLD { background: var(--old); } .tag.NEW { background: var(--new); } .tag.CHANGED { background: var(--chg); }
.sh-x { border: 1px solid rgba(34,30,27,.2); background: transparent; border-radius: 999px; padding: 6px 12px; font-family: var(--f-data); font-size: .7rem; cursor: pointer; color: var(--paper-ink); }
#sheet h2 { font-family: var(--f-prose); font-weight: 400; font-size: 1.9rem; line-height: 1.1; margin: 0 0 4px; letter-spacing: -.01em; }
#sheet .since { font-family: var(--f-data); font-size: .7rem; color: var(--paper-dim); margin: 0 0 14px; }
#sheet .body { font-family: var(--f-prose); font-size: 1.1rem; line-height: 1.55; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.gtile { text-align: left; border: 1px solid rgba(34,30,27,.14); background: rgba(34,30,27,.03); border-radius: 12px; padding: 10px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--paper-ink); }
.gtile b { font-family: var(--f-prose); font-weight: 400; font-size: 1rem; line-height: 1.2; }
.gtile .tag { align-self: flex-start; font-size: .54rem; padding: 3px 7px; }
.gtile.locked { cursor: default; opacity: .5; }
.gtile.locked b { color: var(--paper-dim); }
.sh-sub { font-family: var(--f-data); font-size: .7rem; color: var(--paper-dim); margin: 0 0 14px; line-height: 1.6; }

/* Ending */
.receipt { background: var(--paper); color: var(--paper-ink); font-family: var(--f-data); font-size: .76rem; line-height: 1.55; padding: 22px 18px 20px; border-radius: 4px; width: 100%; max-width: 440px; align-self: center; box-shadow: 0 20px 40px -24px rgba(0,0,0,.6); }
.receipt h2 { font-family: var(--f-prose); font-style: italic; font-weight: 300; font-size: 2.2rem; line-height: 1; margin: 0 0 4px; letter-spacing: -.02em; text-align: center; }
.receipt .c { text-align: center; color: var(--paper-dim); }
.receipt hr { border: 0; border-top: 1px dashed rgba(34,30,27,.3); margin: 12px 0; }
.rrow { display: flex; gap: 6px; align-items: baseline; }
.rrow .lead { flex: 1; border-bottom: 1px dotted rgba(34,30,27,.35); transform: translateY(-3px); min-width: 12px; }
.rrow .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mo { display: flex; gap: 8px; }
.mo .k { width: 1.1em; flex: none; }
.mo.no { color: var(--paper-dim); }
.verdict { font-family: var(--f-prose); font-size: 1.05rem; text-align: center; margin: 4px 0 0; line-height: 1.45; }
.back26 { display: flex; flex-direction: column; gap: 10px; padding: 18px 0 4px; border-top: 1px solid var(--line); }
.back26 h3 { margin: 0; font-family: var(--f-data); font-weight: 400; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.sig { display: flex; flex-direction: column; gap: 14px; }
.sig div { display: grid; grid-template-columns: 3.4em 1fr; gap: 4px 10px; font-size: .95rem; line-height: 1.45; }
.sig .y { font-family: var(--f-data); font-size: .66rem; color: var(--dim); padding-top: .25em; }
.sig .a { font-family: var(--f-wren); font-weight: 300; }
.sig .b { font-family: var(--f-prose); font-style: italic; }
.sig h4 { margin: 0; grid-column: 1 / -1; font-family: var(--f-prose); font-weight: 500; font-size: 1.05rem; }

@media (min-width: 700px) {
  #app { padding-inline: 24px; }
  .n, .p { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {
  #tick { animation: none; }
  #stage > *, ul.sys li, .photo { animation: none; }
  :root { transition: none; }
  .pill i { animation: none; }
}
</style>
</head>
<body>
<div id="sun" aria-hidden="true"></div>
<div id="app">
  <header class="bar">
    <div class="clock"><b id="clk">06:52</b><span id="date">2050</span></div>
    <div class="bar-r">
      <span class="pill wren" id="wstat"><i></i><span>Wren</span></span>
      <button class="pill" id="foundBtn" type="button" aria-label="Pieces of 2050 you have found"><span>◆</span><span id="foundN">0/28</span></button>
      <button class="pill" id="sndBtn" type="button" aria-pressed="false" aria-label="Sound">♪ off</button>
    </div>
  </header>
  <div class="wire" aria-hidden="true"><em>WIRE</em><div class="track"><div id="tick"></div></div></div>
  <main id="stage" aria-live="polite"></main>
  <div id="dock"></div>
</div>

<div id="veil" hidden>
  <p class="qtext" id="qtext"></p>
  <button class="ring" id="ring" type="button" aria-label="Hold to stay in the quiet">
    <svg viewBox="0 0 150 150" aria-hidden="true"><circle class="bg" cx="75" cy="75" r="68"/><circle class="fg" cx="75" cy="75" r="68"/></svg>
    <span>hold</span>
  </button>
  <div class="qtime" id="qtime">0:00</div>
  <div class="qbtns" id="qbtns"></div>
</div>

<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Piece of 2050" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const stage = $("#stage"), dock = $("#dock"), root = document.documentElement;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FASTDEV = location.hash === "#fast";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- The date: today, twenty-four years on ---------- */
const NOW = new Date();
const DAY = new Date(2050, NOW.getMonth(), NOW.getDate());
const DATESTR = DAY.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }).replace(",", "");
$("#date").textContent = DATESTR.replace(/^\w+ /, "");

/* ---------- Pieces of 2050 ---------- */
const ART = {
  wren: ["NEW", "Wren", "With you since 2034", "Your agent. You named it at twenty-three, after a bird you saw that week. It has read every message you’ve sent since. It knows your bank, your blood type and your mother’s birthday. It has no face. You chose that."],
  window: ["OLD", "The window", "Unchanged since 1987", "Single glazing, a draught in winter, fog on cold mornings. Wren could have it replaced in a day. You’ve never asked. Some things you keep because they’re yours."],
  admin: ["CHANGED", "Life admin", "Was: your evenings. Now: agents talking to agents.", "Bills, bookings, returns, forms, disputes. In 2026 it ate hours of every week. Now it’s mostly machines negotiating with other machines in milliseconds, in formats no person reads. You can see the receipts. You rarely look."],
  yourvoice: ["NEW", "Your voice", "Licensed to Wren in 2044", "A model of how you write: your jokes, your sign-offs, the way you avoid exclamation marks. Most adults have one. Etiquette says messages your agent wrote carry a small ◦. Not everyone follows etiquette."],
  fakecall: ["CHANGED", "A familiar voice", "Was: proof. Now: proof of nothing.", "By the mid-2020s, three seconds of audio was enough to clone a voice, and families started agreeing on safe words. Now calls are signed by a device on the caller’s body. An unsigned voice is treated like spam, even when it sounds exactly like your mother."],
  pantry: ["NEW", "The pantry", "Self-ordering since 2039", "It tracks every expiry date and negotiates with three grocers before you wake. Household food waste fell by more than half once kitchens could see what was in them. You haven’t written a shopping list in eleven years."],
  brief: ["CHANGED", "The news", "Was: a feed. Now: a brief.", "Wren reads everything and hands you three sentences, tuned to you. It’s accurate. It’s also yours alone: no two people get the same news. Some people pay extra for a raw feed, just to see what everyone else sees."],
  kettle: ["OLD", "The kettle", "Made in 2019", "It boils water at 100°C, like every kettle since the 1890s. It has no chip in it, which these days makes it slightly expensive. Some things never needed to be intelligent."],
  juno: ["NEW", "Juno, 8", "Born 2042, after everything", "Has never typed a search, waited on hold, or watched a loading bar. Has a tutor that adapts every few seconds and reads four years ahead. Thinks your stories about ‘buffering’ are made up."],
  pencil: ["OLD", "The pencil", "Same design for 200 years", "Graphite in wood. Paper came back in schools around 2040, when teachers noticed kids had stopped finishing anything that couldn’t be undone."],
  school: ["CHANGED", "School", "Was: learn facts. Now: learn people.", "Three days a week. The tutor handles the facts. School handles the rest: sport, arguing well, building things, sitting next to people you didn’t choose. Teachers are mostly coaches now. That turned out to be the hard part all along."],
  principal: ["NEW", "Principal", "A job title since 2038", "The human legally responsible for a set of agents. Agents can do almost anything, but they can’t be sued, fined or ashamed, so the law wants a person’s name on every consequential act. About one in eight working adults is a Principal of something."],
  provenance: ["NEW", "Provenance", "On everything, by 2040", "A record of where a thing came from, who made it and under what conditions. It started in the 2020s as ‘content credentials’ on photos. Now bearings carry it. So does bread. So do sentences."],
  signature: ["OLD", "Your signature", "About 5,000 years old", "A mark that means: I agree, and I answer for it. Machines made almost everything cheap. This went the other way."],
  ring: ["NEW", "Vouch ring", "Standard issue since 2041", "Proves a specific, living human is present. It signs your calls, your payments, your signature. Lose it and you are, briefly and bureaucratically, nobody."],
  teo: ["CHANGED", "Teo, mechanic", "Was: a ‘safe’ job. Still is.", "Robots got good at warehouses and factories first. A seized seventy-year-old bike in a cramped shop took a lot longer. Trades outlasted most office work. Teo earns more than you."],
  pod: ["NEW", "The pod", "No drivers since 2036", "A small electric cab with no driver and no steering wheel. Cheaper than owning a car, so almost nobody owns one. Half the city’s car parks became housing."],
  bread: ["CHANGED", "Human-made", "Was: normal. Now: a label.", "When anything can be generated, a provable human hand became the luxury. Certified human-made goods carry a provenance mark: bread, furniture, essays, songs. Rarer, pricier, more loved. Handmade things went the same way after factories."],
  heat: ["CHANGED", "The heat", "The backdrop to every AI story", "The world crossed 1.5°C of warming for good in the early 2030s. Datacentres fought towns for power and water for a decade. Some of the fixes came from models. Not fast enough. In summer, outdoor work happens at night."],
  glasses: ["CHANGED", "The phone", "Was: a slab. Now: glasses, a ring, a voice.", "The phone didn’t die so much as dissolve. Screens moved into glasses, which left faces free again. Some teenagers carry old slab phones as a fashion statement. They call them bricks."],
  cherry: ["OLD", "The cherry tree", "Planted 1994", "Planted by someone nobody remembers. It blossoms a little earlier every decade. No agent has ever improved it."],
  calendar: ["OLD", "Mom’s calendar", "Paper, every year since 1998", "She writes everything by hand, then lets Gerald read it. She says if she stops writing she’ll stop remembering. The research is mixed. She isn’t waiting for it."],
  gerald: ["NEW", "Gerald", "Leased 2047", "A home robot: third generation, the first that could fold laundry and lift a person safely. Leased, not bought; most are. Mom named it after a man she didn’t like."],
  drug: ["NEW", "The knee treatment", "Designed in 11 days, 2034", "In 2024 a Nobel Prize went to the AI that predicted protein structures. By the 2030s models designed drugs end to end, and trials became the slow part. Mom’s cartilage treatment took eleven days to design and four years to approve."],
  dividend: ["NEW", "Compute dividend", "First paid 2037", "A monthly payment from a public share of AI and energy profits, like Alaska’s oil dividend but everywhere. It was fought over for most of the 2030s. It covers rent and food. It doesn’t cover meaning."],
  film: ["NEW", "A film for one", "Normal since the mid-2030s", "Generated on demand for an audience of one. Most media works like this now. It’s extraordinary, and nobody talks about it at work, because nobody has seen the same thing."],
  theatre: ["CHANGED", "Live theatre", "Was: dying. Now: sold out.", "When perfect, personal media became free, live performance got more valuable. The mistakes are the product. People go to watch other people be imperfect together, in the same room."],
  quiethour: ["NEW", "The Quiet Hour", "Since 2039", "One hour a day with no public agents. It started as a protest in a few cities and stuck, the way weekends stuck. Its grandparents were the ‘right to disconnect’ laws of the 2010s and 2020s."]
};
const ART_IDS = Object.keys(ART);
const found = new Set(store.get("wwk.found", []).filter(id => ART[id]));
function updateFound(bump) {
  $("#foundN").textContent = found.size + "/" + ART_IDS.length;
  if (bump) { const b = $("#foundBtn"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
updateFound();

/* ---------- Sound: a soft pad that follows the sky, and silence when it matters ---------- */
const CHORDS = {
  dawn: [146.83, 220.0, 369.99], morning: [196.0, 293.66, 493.88], midday: [130.81, 196.0, 329.63],
  afternoon: [110.0, 164.81, 277.18], dusk: [174.61, 261.63, 440.0], night: [146.83, 220.0, 329.63]
};
const A = {
  ctx: null, on: false, quiet: false, oscs: [], phase: "dawn",
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    const m = this.m = c.createGain(); m.gain.value = 0; m.connect(c.destination);
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 850; f.Q.value = .5; f.connect(m);
    for (let i = 0; i < 3; i++) {
      const o = c.createOscillator(); o.type = i === 1 ? "triangle" : "sine";
      const g = c.createGain(); g.gain.value = i === 2 ? .2 : .3;
      const l = c.createOscillator(); l.frequency.value = .05 + i * .033;
      const lg = c.createGain(); lg.gain.value = .12; l.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(f); o.start(); l.start(); this.oscs.push(o);
    }
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const n = c.createBufferSource(); n.buffer = b; n.loop = true;
    const nf = c.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 480;
    const ng = c.createGain(); ng.gain.value = .22; n.connect(nf); nf.connect(ng); ng.connect(m); n.start();
    this.chord(this.phase, true);
  },
  set(on) {
    this.on = on;
    const b = $("#sndBtn"); b.textContent = on ? "♪ on" : "♪ off"; b.setAttribute("aria-pressed", String(on));
    if (on) { this.init(); if (!this.ctx) return; this.ctx.resume(); }
    this.level();
  },
  level() {
    if (!this.ctx) return;
    const target = this.on && !this.quiet ? .06 : 0;
    this.m.gain.setTargetAtTime(target, this.ctx.currentTime, this.quiet ? 1.4 : .8);
  },
  chord(p, now) {
    this.phase = p; if (!this.ctx) return;
    const fr = CHORDS[p] || CHORDS.night;
    this.oscs.forEach((o, i) => now ? o.frequency.setValueAtTime(fr[i], this.ctx.currentTime) : o.frequency.setTargetAtTime(fr[i], this.ctx.currentTime, 1.6));
  },
  hush(b) { this.quiet = b; this.level(); },
  blip(f = 1318, v = .03, d = .55, type = "sine") {
    if (!this.on || !this.ctx || this.quiet) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  }
};
$("#sndBtn").addEventListener("click", () => A.set(!A.on));

/* ---------- Text, timing, and the skip ---------- */
let fast = false, skipper = null;
const sleep = ms => new Promise(r => setTimeout(r, FASTDEV ? Math.min(ms, 20) : ms));
function wait(ms) {
  if (fast || FASTDEV) ms = Math.min(ms, 40);
  if (RM) ms = Math.min(ms, 500);
  return new Promise(r => {
    const done = () => { clearTimeout(t); if (skipper === done) skipper = null; r(); };
    const t = setTimeout(done, ms); skipper = done;
  });
}
stage.addEventListener("click", e => {
  if (e.target.closest("button, input, label, canvas, .art")) return;
  if (skipper) { fast = true; skipper(); }
});
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function rich(node, text) {
  const re = /\[\[(\w+)\|([^\]]+)\]\]/g; let i = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > i) node.append(text.slice(i, m.index));
    const b = el("span", "art" + (found.has(m[1]) ? " got" : ""));
    b.setAttribute("role", "button"); b.tabIndex = 0;
    b.dataset.art = m[1]; b.textContent = m[2];
    const id = m[1];
    b.addEventListener("click", e => { e.stopPropagation(); openArt(id); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openArt(id); } });
    node.append(b); i = re.lastIndex;
  }
  if (i < text.length) node.append(text.slice(i));
  return node;
}
function down() { stage.scrollTo({ top: stage.scrollHeight, behavior: RM ? "auto" : "smooth" }); }
function put(node) { stage.append(node); down(); return node; }
const readTime = t => Math.max(800, Math.min(2800, t.replace(/\[\[\w+\||\]\]/g, "").length * 30));

async function say(kind, text, who) {
  const p = el("p", kind);
  if (who) p.append(el("span", "who", who));
  rich(p, text); put(p);
  if (kind === "w") A.blip(1318, .028, .6);
  await wait(readTime(text));
}
const N = t => say("n", t);
const W = t => say("w", t);
const P = (who, t) => say("p" + (who === "You" ? " you" : ""), t, who);
function hint(t) { put(el("p", "hint", t)); }
async function sysList(items, gap, numbered) {
  const ul = put(el("ul", "sys" + (numbered ? " num" : "")));
  for (const it of items) { const li = el("li"); rich(li, it); ul.append(li); down(); A.blip(2200, .008, .08); await wait(gap); }
  await wait(500);
}

function choose(opts) {
  fast = false;
  return new Promise(res => {
    const btns = opts.map(o => {
      const b = el("button", "ch " + (o.kind || "plain")); b.type = "button";
      b.append(el("span", "l", o.label));
      if (o.meta) b.append(el("span", "m", o.meta));
      b.addEventListener("click", () => {
        dock.replaceChildren();
        if (o.echo !== false) put(el("div", "echo", o.label));
        A.blip(o.kind === "hand" ? 523 : 880, .02, .18);
        res(o.k);
      });
      return b;
    });
    dock.replaceChildren(...btns);
  });
}

/* ---------- Sky, clock, wire ---------- */
const SUN = { dawn: ["12%", "88%"], morning: ["30%", "30%"], midday: ["55%", "-5%"], afternoon: ["80%", "25%"], dusk: ["92%", "85%"], night: ["50%", "140%"] };
function setPhase(p) {
  root.dataset.phase = p; A.chord(p);
  const s = SUN[p] || SUN.night; const sun = $("#sun");
  sun.style.setProperty("--sx", s[0]); sun.style.setProperty("--sy", s[1]);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = getComputedStyle(root).getPropertyValue("--sky1").trim() || "#1b2034";
}
function setWren(on) {
  const w = $("#wstat"); w.classList.toggle("off", !on);
  w.querySelector("span").textContent = on ? "Wren" : "Wren · quiet";
}
function setWire(list) {
  const t = $("#tick"); t.replaceChildren();
  if (!list.length) return;
  for (let k = 0; k < 2; k++) for (const h of list) t.append(el("span", null, h));
  const chars = list.join("").length;
  t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
  t.style.animationDuration = Math.max(24, chars * .2) + "s";
}
async function scene(time, phase, place, wire) {
  stage.classList.add("out"); await sleep(RM ? 0 : 420);
  stage.replaceChildren(); stage.classList.remove("out"); stage.scrollTop = 0;
  setPhase(phase); $("#clk").textContent = time; setWire(wire || []);
  const c = el("div", "chap"); c.append(el("span", "t", time), el("span", "pl", place)); put(c);
  await wait(1000);
}

/* ---------- Sheet: a piece of 2050, or all of them ---------- */
const sheet = $("#sheet"), scrim = $("#scrim");
let lastFocus = null;
function showSheet() {
  lastFocus = document.activeElement;
  sheet.hidden = false; scrim.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add("on"); scrim.classList.add("on"); });
  const x = sheet.querySelector(".sh-x"); if (x) x.focus({ preventScroll: true });
}
function closeSheet() {
  sheet.classList.remove("on"); scrim.classList.remove("on");
  setTimeout(() => { sheet.hidden = true; scrim.hidden = true; }, 380);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
function artView(id, back) {
  const [tag, title, since, body] = ART[id];
  sheet.replaceChildren();
  const top = el("div", "sh-top");
  const left = el("div"); left.style.display = "flex"; left.style.gap = "8px"; left.style.alignItems = "center";
  left.append(el("span", "tag " + tag, tag === "OLD" ? "STILL HERE" : tag === "NEW" ? "NEW SINCE 2026" : "CHANGED"));
  if (back) { const b = el("button", "sh-x", "← all"); b.type = "button"; b.onclick = () => gridView(); left.append(b); }
  const x = el("button", "sh-x", "close"); x.type = "button"; x.onclick = closeSheet;
  top.append(left, x);
  sheet.append(top, el("h2", null, title), el("p", "since", since), el("p", "body", body));
  sheet.setAttribute("aria-label", title);
}
function openArt(id) {
  const isNew = !found.has(id);
  found.add(id); store.set("wwk.found", [...found]); updateFound(isNew);
  document.querySelectorAll('.art[data-art="' + id + '"]').forEach(b => b.classList.add("got"));
  if (isNew) A.blip(1760, .025, .4);
  artView(id, false); showSheet();
}
function gridView() {
  sheet.replaceChildren();
  const top = el("div", "sh-top");
  top.append(el("span", "tag NEW", found.size + " OF " + ART_IDS.length + " FOUND"));
  const x = el("button", "sh-x", "close"); x.type = "button"; x.onclick = closeSheet; top.append(x);
  sheet.append(top, el("h2", null, "Pieces of 2050"),
    el("p", "sh-sub", "Dotted words in the story. Brown: still here from before. Blue: new since 2026. Green: still here, but changed. Some only appear if you choose a certain way."));
  const g = el("div", "grid");
  for (const id of ART_IDS) {
    const [tag, title] = ART[id]; const has = found.has(id);
    const t = el("button", "gtile" + (has ? "" : " locked")); t.type = "button";
    t.append(el("span", "tag " + tag, tag === "CHANGED" ? "CHANGED" : tag), el("b", null, has ? title : "—"));
    if (has) t.onclick = () => artView(id, true); else t.disabled = true;
    g.append(t);
  }
  sheet.append(g); sheet.setAttribute("aria-label", "Pieces of 2050");
}
$("#foundBtn").addEventListener("click", () => { gridView(); showSheet(); });

/* ---------- Things you do with your hands ---------- */
function pour() {
  return new Promise(res => {
    const box = put(el("div", "mini"));
    const wrap = el("div", "cupwrap"), cup = el("div", "cup"), fill = el("div", "fill"), spill = el("div", "spill");
    cup.append(fill); wrap.append(cup, spill); box.append(wrap, el("div", "cap", "Press and hold to pour. Let go when it looks right."));
    down();
    const btn = el("button", "ch hand hold", "Hold to pour"); btn.type = "button"; dock.replaceChildren(btn);
    let lvl = 0, holding = false, t0 = 0, raf = 0, doneFlag = false;
    const ac = new AbortController(), sig = { signal: ac.signal };
    const step = t => {
      if (!holding) return;
      lvl += ((t - t0) / 1000) * (24 + lvl * .4); t0 = t;
      fill.style.height = Math.min(lvl, 100) + "%";
      if (lvl > 100) spill.classList.add("on");
      if (lvl >= 108) { stop(); return; }
      raf = requestAnimationFrame(step);
    };
    const start = e => { if (e.cancelable) e.preventDefault(); if (holding || doneFlag) return; holding = true; btn.classList.add("on"); t0 = performance.now(); if (e.pointerId != null) try { btn.setPointerCapture(e.pointerId); } catch (_) {} raf = requestAnimationFrame(step); };
    const stop = () => {
      if (!holding) return; holding = false; cancelAnimationFrame(raf); btn.classList.remove("on");
      if (lvl < 4) return;
      doneFlag = true; ac.abort(); dock.replaceChildren(); res(lvl);
    };
    btn.addEventListener("pointerdown", start, sig);
    btn.addEventListener("pointerup", stop, sig);
    btn.addEventListener("pointercancel", stop, sig);
    btn.addEventListener("contextmenu", e => e.preventDefault(), sig);
    btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); }, sig);
    btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); }, sig);
  });
}

function compose(picks) { return picks.join(" "); }
function builder(tiles) {
  return new Promise(res => {
    const box = put(el("div", "mini"));
    const out = el("p", "built", "…"), grid = el("div", "tiles"), picked = [];
    box.append(el("div", "cap", "Build your answer. Pick up to three, in the order you’d say them."), out, grid);
    const go = el("button", "ch hand", "Say it"); go.type = "button"; go.disabled = true;
    const render = () => { out.textContent = picked.length ? compose(picked) : "…"; go.disabled = !picked.length; };
    tiles.forEach(t => {
      const b = el("button", "tile", t); b.type = "button";
      b.addEventListener("click", () => {
        const i = picked.indexOf(t);
        if (i >= 0) { picked.splice(i, 1); b.classList.remove("on"); }
        else if (picked.length < 3) { picked.push(t); b.classList.add("on"); }
        render();
      });
      grid.append(b);
    });
    dock.replaceChildren(go); down();
    go.addEventListener("click", () => { dock.replaceChildren(); box.remove(); res(picked.slice()); });
  });
}

function sigPad(label) {
  return new Promise(res => {
    const box = put(el("div", "mini"));
    const sb = el("div", "sigbox"), cv = el("canvas"); sb.append(cv);
    box.append(sb, el("div", "cap", label || "Sign with your finger."));
    down();
    const clear = el("button", "ch small plain", "Clear"), ok = el("button", "ch small hand", "Sign");
    clear.type = ok.type = "button"; ok.disabled = true;

const veil = $("#veil");
function quietHold(total) {
  const ring = $("#ring"), txt = $("#qtext"), tm = $("#qtime"), btns = $("#qbtns");
  const lines = [
    [0, "Stay."], [3, "The fridge hums. You’d forgotten it did that."], [7, "You go to ask Wren the time. You stop."],
    [11, "A neighbour laughs through the wall."], [15, "Juno is humming something tuneless at the table."],
    [19, "You notice you’re waiting for something to need you."], [23, "Nothing does."], [27, "That’s all right."]
  ];
  const scale = total / 30;
  const setText = t => { txt.classList.add("fade"); setTimeout(() => { txt.textContent = t; txt.classList.remove("fade"); }, RM ? 0 : 420); };
  return new Promise(res => {
    btns.replaceChildren(); ring.hidden = false; tm.hidden = false;
    ring.style.setProperty("--p", 0); tm.textContent = "0:00";
    txt.textContent = "Hold the circle with your thumb. Stay as long as you can.";
    let holding = false, t0 = 0, held = 0, raf = 0, shown = -1;
    const ac = new AbortController(), sig = { signal: ac.signal };
    const fmt = s => "0:" + String(Math.floor(s)).padStart(2, "0");
    const loop = t => {
      if (!holding) return;
      held = (t - t0) / 1000;
      tm.textContent = fmt(held / scale);
      ring.style.setProperty("--p", Math.min(held / total, 1));
      let idx = 0; for (let i = 0; i < lines.length; i++) if (held >= lines[i][0] * scale) idx = i;
      if (idx !== shown) { shown = idx; setText(lines[idx][1]); }
      if (held >= total) { finish(true); return; }
      raf = requestAnimationFrame(loop);
    };
    const start = e => { if (e.cancelable) e.preventDefault(); if (holding) return; holding = true; ring.classList.add("on"); t0 = performance.now(); held = 0; shown = -1; if (e.pointerId != null) try { ring.setPointerCapture(e.pointerId); } catch (_) {} raf = requestAnimationFrame(loop); };
    const stop = () => { if (!holding) return; holding = false; ring.classList.remove("on"); cancelAnimationFrame(raf); if (held < total) finish(false); };
    const finish = ok => { holding = false; ac.abort(); ring.classList.remove("on"); res({ ok, held: Math.round(held / scale) }); };
    ring.addEventListener("pointerdown", start, sig);
    ring.addEventListener("pointerup", stop, sig);
    ring.addEventListener("pointercancel", stop, sig);
    ring.addEventListener("contextmenu", e => e.preventDefault(), sig);
    ring.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); }, sig);
    ring.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); }, sig);
  });
}

  await scene("18:00", "dusk", "The Quiet Hour", ["Quiet Hour turns eleven · citywide participation 68%", "Tram lights dim 18:00–19:00"]);
  await N("At six the city goes quiet. [[quiethour|The Quiet Hour]]. Every public agent stops. Most private ones follow.");
  await N("Through the window, the lights along the tram line dim one by one.");
  await W("I’ll be back at seven. Or I can stay on. About a third of homes keep us on.");
  const c = await choose([{ k: "on", label: "Stay on", meta: "convenient", kind: "ai" }, { k: "quiet", label: "Let it go quiet", meta: "1 hr", kind: "hand" }]);
  if (c === "on") {
    S.quiet = "on";
    await W("Staying. Shall I plan dinner?");
    await N("Outside, the city goes dim. Your house stays lit and talking.");
    await N("Juno looks at you a moment longer than usual, then goes back to the paper.");
    return;
  }
  S.quiet = "quiet"; S.hand.quiet = true; S.min += 60;
  await W("See you at seven.");
  setWren(false); A.hush(true); setWire([]);
  veil.hidden = false; requestAnimationFrame(() => veil.classList.add("on"));
  await sleep(RM ? 0 : 2200);
  const total = FASTDEV ? 2 : 30;
  for (;;) {
    const r = await quietHold(total);
    S.quietHeld = Math.max(S.quietHeld, r.held);
    if (r.ok) { S.quietOk = true; await veilChoice("Seven o’clock comes sooner than you thought.", [{ k: "ok", label: "Seven o’clock" }]); break; }
    const k = await veilChoice("You let go at 0:" + String(r.held).padStart(2, "0") + ". Most people do, the first time.", [{ k: "again", label: "Try again" }, { k: "fine", label: "Let it be" }]);
    if (k === "fine") break;
  }
  veil.classList.remove("on"); await sleep(RM ? 0 : 1200); veil.hidden = true;
  setWren(true); A.hush(false);
  await N("At seven, Wren comes back as if from another room.");
  await W("Anything happen?");
  await N("You think about it. “No,” you say. It’s true and it isn’t.");
}

async function night() {
  await scene("22:30", "night", "Night", ["Orbital datacentre #3 online · grid relief for heat zones", "Tomorrow: 31°C · your run moved to 06:10"]);
  if (S.junoBy === "you") await N("Juno’s asleep. The drawing of you is on the fridge, held up by a magnet shaped like a pear. Your nose is enormous.");
  else await N("Juno’s asleep. The bird drawing is on the fridge, held up by a magnet shaped like a pear.");
  await W("Can I ask you something? You’re the only one who can answer it.");
  await W("Tomorrow I can do all of it. The coffee. The walk. The answers. The waiting. Faster than you, and better.");
  await W("Which ones should I leave for you?");
  const items = [
    { id: "coffee", label: "Making the coffee", on: S.hand.coffee },
    { id: "juno", label: "Answering Juno’s questions", on: S.hand.juno },
    { id: "mom", label: "Seeing Mom in person", on: S.hand.mom },
    { id: "walk", label: "Walking places", on: S.hand.walk },
    { id: "show", label: "Live things, with other people", on: S.hand.show },
    { id: "quiet", label: "The quiet hour", on: S.hand.quiet },
    { id: "voice", label: "Writing to friends in my own words", note: "Wren did this overnight" },
    { id: "news", label: "Choosing my own news", note: "Wren did this overnight" },
    { id: "sign", label: "Signing my name", locked: true, on: true, note: "The law keeps this one for you" }
  ];
  const kept = await keepList(items);
  S.kept = kept;
  const open = items.filter(i => !i.locked).length;
  if (kept.length === 0) { await W("Then I’ll take all of it. You won’t have to do anything tomorrow."); await W("Goodnight."); }
  else if (kept.length === open) { await W("All of them?"); await W("Then I’ll do what’s left. The other two hundred and fourteen. Goodnight."); }
  else if (kept.length >= 4) { await W("That’s a lot to keep. Good."); await W("I’ll take the rest. Goodnight."); }
  else { await W("Okay. I’ll leave " + (kept.length === 1 ? "that one" : "those") + " for you, and do the rest."); await W("Goodnight."); }
  await N("Wren dims the lights. Somewhere, a machine pays your power bill.");
  await N("You fall asleep in the middle of a thought, the way people always have.");
  await choose([{ k: "end", label: "See what you kept", kind: "plain", echo: false }]);
}

async function ending() {
  await scene("23:59", "night", "End of day", []);
  const moments = [
    ["coffee", "Made the coffee", "The kitchen made the coffee"],
    ["juno", "Answered Juno yourself", "Wren answered Juno"],
    ["sign", S.supplier === "signed" ? "Signed for the new supplier" : "Declined the supplier", null, true],
    ["mom", "Went to see Mom", "Sent soup by drone"],
    S.momBy === "visit" ? ["walk", "Walked 1.9 km", "Took a pod"] : null,
    S.momBy === "visit" ? ["lunch", "Stayed for lunch", "Left before lunch"] : null,
    ["show", "Went to the live show", "Watched a film made only for you"],
    ["quiet", S.quietOk ? "Held the quiet hour" : "Let it go quiet (held 0:" + String(S.quietHeld).padStart(2, "0") + ")", "Kept Wren on"]
  ].filter(Boolean);
  const handCount = moments.filter(m => m[3] || S.hand[m[0]]).length;
  const delegated = moments.length - handCount;
  const handMoments = ["coffee", "juno", "mom", "walk", "lunch", "show", "quiet"].filter(k => S.hand[k]).length;
  const hm = m => Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";

  const r = el("div", "receipt");
  r.append(el("h2", null, "What you kept"), el("div", "c", DATESTR + " · 06:52–22:30"), el("hr"));
  const row = (a, b) => { const d = el("div", "rrow"); d.append(el("span", null, a), el("span", "lead"), el("span", "v", b)); return d; };
  r.append(row("Handled by Wren", String(214 + delegated)), row("Done with your own hands", String(handCount)), el("hr"));
  for (const m of moments) {
    const yes = m[3] || S.hand[m[0]];
    const d = el("div", "mo" + (yes ? "" : " no"));
    d.append(el("span", "k", yes ? "✓" : "◦"), el("span", null, yes ? m[1] : m[2]));
    r.append(d);
  }
  r.append(el("hr"), row("Time Wren saved you", "≈ 6h 50m"), row("Time you spent by hand", hm(S.min)), row("Pieces of 2050 found", found.size + " / " + ART_IDS.length));
  const labels = { coffee: "coffee", juno: "Juno’s questions", mom: "Mom", walk: "walking", show: "live things", quiet: "the quiet hour", voice: "your own words", news: "your own news" };
  r.append(el("hr"));
  const tl = el("div", null); tl.append(el("div", null, "Left for you tomorrow:"));
  tl.append(el("div", "c", S.kept.length ? S.kept.map(k => labels[k]).join(" · ") + " · your signature" : "your signature (the law insisted)"));
  r.append(tl, el("hr"));
  const verdict = handMoments <= 1 ? "A smooth day. Nothing needed you, and you let it not need you."
    : handMoments <= 4 ? "A mixed day. Some of it was yours."
    : "A slow day. A full one.";
  r.append(el("p", "verdict", verdict));
  put(r);
  await wait(900);

  const b = el("div", "back26");
  b.append(el("h3", null, "Back in 2026"));
  b.append(el("p", "n", "The first photo in Mom’s album is you at fifteen, typing into a box. That’s now."));
  b.append(el("p", "n", "Today you do most things by hand without thinking. By 2050, each one becomes a choice. Some you’ll be glad to hand over. Some you’ll miss."));
  b.append(el("p", "n", "Try one tomorrow: pick something you could hand off, and do it yourself, slowly, on purpose. Notice what it gives you."));
  put(b);

  const endDock = () => {
    const a = el("button", "ch plain", "<span class='l'>What this is based on</span><span class='m'>2026 → 2050</span>"); a.type = "button";
    const f = el("button", "ch plain", "<span class='l'>Pieces of 2050</span><span class='m'>" + found.size + " / " + ART_IDS.length + "</span>"); f.type = "button";
    const g = el("button", "ch hand", "<span class='l'>Live the day again</span><span class='m'>choose differently</span>"); g.type = "button";
    a.onclick = () => { showSignals(); a.remove(); };
    f.onclick = () => { gridView(); showSheet(); };
    g.onclick = () => { dock.replaceChildren(); playDay(); };
    dock.replaceChildren(a, f, g);
  };
  endDock();
}
function showSignals() {
  const s = el("div", "back26");
  s.append(el("h3", null, "What this is based on"));
  s.append(el("p", "n", "Every piece of this day is a line drawn from something already true in 2026."));
  const list = el("div", "sig");
  for (const [h, now, then] of SIGNALS) {
    const d = el("div");
    d.append(el("h4", null, h), el("span", "y", "2026"), el("span", "a", now), el("span", "y", "2050"), el("span", "b", then));
    list.append(d);
  }
  s.append(list);
  put(s);
  s.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
}

async function playDay() {
  S = fresh(); setWren(true);
  await wake(); await kitchen(); await junoScene(); await signScene();
  await momScene(); await afternoon(); await quietScene(); await night(); await ending();
}
async function main() {
  await titleScreen();
  await playDay();
}
const boot = () => main().catch(err => { console.error(err); });
boot();
